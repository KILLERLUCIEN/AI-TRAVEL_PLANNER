<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>500 — TripPilot AI</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<main style="min-height:100vh;display:grid;place-items:center;padding:25px">
  <section style="text-align:center;max-width:620px">
    <div class="eyebrow">ERROR / 500</div>
    <h1 style="font:700 clamp(70px,15vw,150px)/1 'Space Grotesk';margin:15px 0;color:var(--orange)">500</h1>
    <h2 style="margin:0 0 15px">The travel engine hit turbulence.</h2>
    <p style="color:var(--muted);line-height:1.7">Something went wrong on the server. Please try again, or return to the planner.</p>
    <a class="primary-btn" style="display:inline-block;margin-top:15px" href="/">Back to TripPilot →</a>
  </section>
</main>
</body>
</html>
